openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: prices
    description: Live market price operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /prices:
    get:
      operationId: getPrices
      tags: [prices]
      summary: Get live gold, coin, and currency prices
      description: Fetches live prices from Iranian market APIs
      responses:
        "200":
          description: Current prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricesResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PricesResponse:
      type: object
      properties:
        gold18:
          type: string
        gold24:
          type: string
        mithqal:
          type: string
        emamiCoin:
          type: string
        baharCoin:
          type: string
        halfCoin:
          type: string
        quarterCoin:
          type: string
        usd:
          type: string
        eur:
          type: string
        gbp:
          type: string
        aed:
          type: string
        usdt:
          type: string
        updatedAt:
          type: string
      required:
        - gold18
        - gold24
        - mithqal
        - emamiCoin
        - baharCoin
        - halfCoin
        - quarterCoin
        - usd
        - eur
        - gbp
        - aed
        - usdt
        - updatedAt
