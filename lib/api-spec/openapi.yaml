openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: prices
    description: Live market price operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /prices:
    get:
      operationId: getPrices
      tags: [prices]
      summary: Get live gold, coin, and currency prices
      description: Fetches live prices from Iranian market APIs
      responses:
        "200":
          description: Current prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricesResponse"
  /global-prices:
    get:
      operationId: getGlobalCryptoPrices
      tags: [prices]
      summary: Get global cryptocurrency prices in USD
      description: Fetches live prices and 24-hour changes from CoinGecko.
      responses:
        "200":
          description: Global cryptocurrency prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalCryptoPricesResponse"
        "502":
          description: CoinGecko is unavailable
  /iranian-prices:
    get:
      operationId: getIranianCryptoPrices
      tags: [prices]
      summary: Get Iranian cryptocurrency prices
      description: Fetches last trade prices from Nobitex in IRR and Toman.
      responses:
        "200":
          description: Iranian cryptocurrency prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IranianCryptoPricesResponse"
        "502":
          description: Nobitex is unavailable
  /list:
    get:
      operationId: getCryptoList
      tags: [prices]
      summary: Get the live cryptocurrency list
      responses:
        "200":
          description: Live cryptocurrency prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoListResponse"
        "500":
          description: Failed to fetch cryptocurrency prices
  /add:
    post:
      operationId: addCryptoPrice
      tags: [prices]
      summary: Validate a cryptocurrency price submission
      description: Accepts a price payload without persisting it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCryptoPriceRequest"
      responses:
        "201":
          description: Price payload accepted without persistence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddCryptoPriceResponse"
        "400":
          description: Invalid cryptocurrency name or price
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PricesResponse:
      type: object
      properties:
        gold18:
          type: string
        gold24:
          type: string
        mithqal:
          type: string
        emamiCoin:
          type: string
        baharCoin:
          type: string
        halfCoin:
          type: string
        quarterCoin:
          type: string
        usd:
          type: string
        eur:
          type: string
        gbp:
          type: string
        aed:
          type: string
        usdt:
          type: string
        updatedAt:
          type: string
      required:
        - gold18
        - gold24
        - mithqal
        - emamiCoin
        - baharCoin
        - halfCoin
        - quarterCoin
        - usd
        - eur
        - gbp
        - aed
        - usdt
        - updatedAt
    GlobalCryptoPrice:
      type: object
      properties:
        usd:
          type: number
        usd_24h_change:
          type: number
          nullable: true
      required: [usd, usd_24h_change]
    GlobalCryptoPricesResponse:
      type: object
      properties:
        success:
          type: boolean
        source:
          type: string
        currency:
          type: string
        data:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/GlobalCryptoPrice"
      required: [success, source, currency, data]
    IranianCryptoPriceValues:
      type: object
      properties:
        USDT:
          type: number
        BTC:
          type: number
        ETH:
          type: number
        TRX:
          type: number
        SOL:
          type: number
        TON:
          type: number
      required: [USDT, BTC, ETH, TRX, SOL, TON]
    IranianCryptoPricesResponse:
      type: object
      properties:
        success:
          type: boolean
        source:
          type: string
        rawCurrency:
          type: string
        currency:
          type: string
        data:
          type: object
          properties:
            rial:
              $ref: "#/components/schemas/IranianCryptoPriceValues"
            toman:
              $ref: "#/components/schemas/IranianCryptoPriceValues"
          required: [rial, toman]
      required: [success, source, rawCurrency, currency, data]
    CryptoListItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        symbol:
          type: string
        price:
          type: string
      required: [id, name, symbol, price]
    CryptoListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/CryptoListItem"
      required: [success, message, data]
    AddCryptoPriceRequest:
      type: object
      properties:
        coinName:
          type: string
        price:
          oneOf:
            - type: number
            - type: string
      required: [coinName, price]
    AddCryptoPriceResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            coinName:
              type: string
            price:
              type: number
            persisted:
              type: boolean
          required: [coinName, price, persisted]
      required: [success, message, data]
